name: Prepare Environment
description: Prepare the macOS build environment.
inputs:
  ref:
    description: If set, the ref to checkout.
  install_test_deps:
    description: If true, dependencies needed for running tests will be installed.
  install_release_deps:
    description: If true, dependencies needed for building release artifacts will be installed.

runs:
  using: composite
  steps:
    - name: Make GitHub token available
      shell: bash
      run: echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

    - name: Determine repository root
      id: repo-root
      shell: bash
      run: |
        REPO_ROOT=$(cd "${{ github.action_path }}/../../.." && pwd)
        echo "path=$REPO_ROOT" >> "$GITHUB_OUTPUT"

    # Materialize Git LFS objects
    - name: Fetch Git LFS objects
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        git lfs install --local
        git lfs pull

    # Print a per-file listing of the LFS payloads in debug mode
    - name: Verify LFS payloads
      if: ${{ runner.debug == '1' }}
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        git lfs ls-files --size

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        key: macos-arm64
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37
      env:
        BINSTALL_VERSION: 1.14.4

    - name: Install dependencies
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        if ${{ inputs.install_release_deps == 'true' }}; then
          ./script/install_cargo_release_deps
        else
          ./script/install_cargo_build_deps
        fi

    - name: Install Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 20.9.0

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Install test dependencies
      if: ${{ inputs.install_test_deps == 'true' }}
      shell: bash
      run: |
        brew install fish bash || true

    - name: Install protoc
      shell: bash
      run: brew install protobuf
