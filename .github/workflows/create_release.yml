name: Create Warply Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  macos-arm64-dmg:
    name: Build signed macOS arm64 DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: ./.github/actions/prepare_environment
        with:
          install_release_deps: true

      - name: Install release tools
        shell: bash
        run: |
          ./script/install_cargo_bundle
          brew install create-dmg

      - name: Build signed DMG
        id: bundle
        shell: bash
        env:
          WARPLY_APPLE_TEAM_ID: ${{ secrets.WARPLY_APPLE_TEAM_ID }}
          WARPLY_DEVELOPER_ID_CERT: ${{ secrets.WARPLY_DEVELOPER_ID_CERT }}
          WARPLY_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.WARPLY_DEVELOPER_ID_CERT_PASSWORD }}
          WARPLY_CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.WARPLY_CODESIGN_KEYCHAIN_PASSWORD }}
          WARPLY_APP_STORE_CONNECT_KEY_ID: ${{ secrets.WARPLY_APP_STORE_CONNECT_KEY_ID }}
          WARPLY_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.WARPLY_APP_STORE_CONNECT_ISSUER_ID }}
          WARPLY_APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.WARPLY_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: ./script/bundle --channel oss --arch aarch64 --read-signing-secrets-from-env --release-tag "${{ github.ref_name }}"

      - name: Generate Sparkle appcast
        shell: bash
        env:
          WARPLY_SPARKLE_PRIVATE_KEY: ${{ secrets.WARPLY_SPARKLE_PRIVATE_KEY }}
          GIT_RELEASE_TAG: ${{ github.ref_name }}
        run: ./script/generate_sparkle_appcast target/release-lto/bundle/osx

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warply-macOS-arm64
          path: |
            target/release-lto/bundle/osx/Warply.dmg
            target/release-lto/bundle/osx/appcast.xml
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            target/release-lto/bundle/osx/Warply.dmg \
            target/release-lto/bundle/osx/appcast.xml \
            --title "Warply ${{ github.ref_name }}" \
            --notes "Warply macOS arm64 signed DMG."
