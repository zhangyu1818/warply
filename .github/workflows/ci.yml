name: Warply CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: macOS checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: ./.github/actions/prepare_environment
        with:
          install_test_deps: true

      - name: Install cargo-nextest
        shell: bash
        run: cargo binstall --force -y cargo-nextest

      - name: Format
        shell: bash
        run: cargo fmt -- --check

      - name: Check app
        shell: bash
        run: cargo check -p warp --all-targets --locked --message-format short

      - name: Check workspace
        shell: bash
        run: cargo check --workspace --all-targets --locked --message-format short

      - name: Focused tests
        shell: bash
        run: cargo nextest run -p warp -E 'test(slash_command) | test(acp) | test(terminal_suggestions)'

  bundle-check:
    name: macOS arm64 bundle check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: ./.github/actions/prepare_environment
        with:
          install_release_deps: true

      - name: Install cargo-bundle
        shell: bash
        run: ./script/install_cargo_bundle

      - name: Check Warply bundle
        shell: bash
        run: ./script/bundle --channel oss --arch aarch64 --check-only
