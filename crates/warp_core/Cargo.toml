[package]
name = "warp_core"
edition = "2024"
authors = ["Warply Team <dev@warply.local>"]
publish.workspace = true
license.workspace = true

[features]
default = ["local_fs"]
integration_tests = []
local_fs = []
release_bundle = []
# Enabled when building the self-contained standalone CLI binary (see the bundle
# script). Keep in sync with the `app` crate's `standalone` feature.
standalone = []
test-util = ["dep:mockito", "warp_features/test-util"]

[dependencies]
anyhow.workspace = true
async-broadcast.workspace = true
asset_macro.workspace = true
chrono.workspace = true
cocoa.workspace = true
command-corrections.workspace = true
concat-idents.workspace = true
dashmap.workspace = true
dirs.workspace = true
directories.workspace = true
enum-iterator.workspace = true
futures.workspace = true
getset.workspace = true
instant.workspace = true
itertools.workspace = true
lazy_static.workspace = true
line-ending.workspace = true
log.workspace = true
mockito = { workspace = true, optional = true }
objc.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSString",
    "NSURL",
    "NSFileManager",
    "NSBundle",
] }
parking_lot.workspace = true
regex.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
settings.workspace = true
settings_value = { workspace = true, features = ["derive"] }
shellexpand.workspace = true
strum.workspace = true
strum_macros.workspace = true
string-offset.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
warp_features.workspace = true
warp_util.workspace = true
warpui.workspace = true
warpui_extras = { workspace = true, features = ["default"] }

[dev-dependencies]
rand.workspace = true
serde_yaml.workspace = true
