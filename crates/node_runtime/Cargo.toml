[package]
name = "node_runtime"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
default = ["local_fs"]
local_fs = []

[dependencies]
anyhow = { workspace = true }
async-fs = { workspace = true }
async-trait = { workspace = true }
cfg-if = { workspace = true }
command.workspace = true
flate2 = "1.0"
futures = { workspace = true }
http_client = { workspace = true }
log = { workspace = true }
semver = "1.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = "0.4"
warp_core = { workspace = true }
# zip 9 defaults enable bzip2 -> libbz2-rs-sys (license bzip2-1.0.6), which cargo-deny rejects.
zip = { version = "9.0.5", default-features = false, features = [
    "aes-crypto",
    "deflate",
    "deflate64",
    "lzma",
    "ppmd",
    "time",
    "xz",
    "zstd",
] }
